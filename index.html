```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de funcionalidad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f2f2f2;
    }

    main {
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    input, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Prueba de funcionalidad</h1>
    <p>Formulario para comprobar el funcionamiento del sitio web.</p>

    <form id="formulario">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" required>

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" required>

      <button type="submit">Enviar formulario</button>
    </form>

    <p id="mensaje"></p>

    <button id="botonPrueba" type="button">Probar botón</button>
    <p id="resultado"></p>
  </main>

  <script>
    document.getElementById("formulario").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("mensaje").textContent =
        "Formulario validado correctamente.";
    });

    document.getElementById("botonPrueba").addEventListener("click", function() {
      document.getElementById("resultado").textContent =
        "El botón funciona correctamente.";
    });
  </script>
</body>
</html>
```
